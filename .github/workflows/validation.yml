name: Validation

on:
  push:
    branches:
      - main
      - v1.8
      - 'ci-validation-fixture/**'
  pull_request:
    branches:
      - main
      - v1.8

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check active Markdown links
        run: bash scripts/validation/check-active-markdown-links.sh

      - name: Check review workflow policy
        run: bash scripts/validation/check-review-workflow-policy.sh

      - name: Check orchestrator review
        run: bash scripts/validation/check-orchestrator-review.sh

      - name: Check Workflow-Scripts sync
        run: bash scripts/validation/check-sync-workflow-scripts.sh

      - name: Check update helper
        run: bash scripts/validation/check-update-workflows.sh

      - name: Check completion-chain policy
        run: bash scripts/validation/check-completion-chain-policy.sh

      - name: Check meta-log validator self-test
        run: bash scripts/validation/check-meta-logs-selftest.sh

      - name: Check new commits are logged in 00-project
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          bash scripts/validation/check-meta-logs.sh --range "$BASE_SHA..HEAD"
